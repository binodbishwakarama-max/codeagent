name: "Prism Review"
description: "Autonomous, standards-driven AI code review for pull requests with empirical benchmark verification."
author: "binodbishwakarama-max"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  github-token:
    description: "GitHub Token for posting review comments and fetching PR diffs"
    required: true
    default: ${{ github.token }}
  standards-file:
    description: "Path to repository standards YAML file"
    required: false
    default: ".prism/standards.yml"
  llm-provider:
    description: "LLM provider (auto, anthropic, or openai_compat)"
    required: false
    default: "auto"
  llm-model:
    description: "Model identifier (e.g. claude-3-5-sonnet-20241022 or qwen2.5-coder-7b)"
    required: false
    default: "claude-3-5-sonnet-20241022"
  llm-base-url:
    description: "Base URL for self-hosted OpenAI-compatible inference servers (e.g. vLLM, Ollama)"
    required: false
    default: ""
  anthropic-api-key:
    description: "Anthropic API key for frontier model reviews"
    required: false
    default: ""
  openai-api-key:
    description: "OpenAI or OpenAI-compatible API key"
    required: false
    default: ""
  post-comments:
    description: "Whether to post inline review comments directly to the pull request"
    required: false
    default: "true"
  fail-on-severity:
    description: "Fail the workflow job if violations of this severity are found (none, high, or medium)"
    required: false
    default: "none"

outputs:
  findings-count:
    description: "Total number of actionable findings detected"
    value: ${{ steps.prism-review-step.outputs.findings_count }}
  clean-pr:
    description: "Whether the pull request was verified as clean"
    value: ${{ steps.prism-review-step.outputs.clean_pr }}
  review-status:
    description: "Review outcome status (passed or failed)"
    value: ${{ steps.prism-review-step.outputs.review_status }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv package manager
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        version: "latest"

    - name: Install Prism
      shell: bash
      run: |
        uv pip install "${{ github.action_path }}" --system

    - name: Run Prism Code Review
      id: prism-review-step
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_STANDARDS_FILE: ${{ inputs.standards-file }}
        INPUT_LLM_PROVIDER: ${{ inputs.llm-provider }}
        INPUT_LLM_MODEL: ${{ inputs.llm-model }}
        INPUT_LLM_BASE_URL: ${{ inputs.llm-base-url }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        INPUT_POST_COMMENTS: ${{ inputs.post-comments }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
      run: |
        uv run python -m prism.github.action
