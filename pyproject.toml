[project]
name = "prism-review"
version = "0.1.0"
description = "A GitHub App that reviews pull requests against custom engineering standards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "arq>=0.25.0",
    "pyyaml>=6.0.1",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "streamlit>=1.65.0",
    "tree-sitter>=0.26.0",
    "pgvector>=0.5.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "fastembed>=0.9.0",
    "prometheus-client>=0.26.0",
    "langfuse>=5.0.2",
]

[project.scripts]
prism = "prism.review.cli:main"
prism-action = "prism.github.action:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy==1.14.1",
    "respx>=0.23.1",
    "types-pyyaml>=6.0.12.20240311",
    "types-redis>=4.6.0.20240425",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism", "evals", "training"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "arq.*",
    "alembic.*",
    "asyncpg.*",
    "greenlet.*",
    "streamlit.*",
    "torch.*",
    "transformers.*",
    "trl.*",
    "peft.*",
    "unsloth.*",
    "datasets.*",
    "bitsandbytes.*",
    "modal.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "training.modal_train"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "matplotlib>=3.11.2",
]
