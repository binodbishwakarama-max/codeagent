version: "1.0"
standards:
  - id: STD-SEC-01
    title: Zero Plaintext Credentials or API Secrets
    description: Never commit raw passwords, private keys, JWT secrets, or cloud API
      tokens into source code. Retrieve sensitive credentials exclusively from validated
      environment variables or external secret stores.
    good_example: "api_key = os.environ.get('STRIPE_API_KEY')\nif not api_key:\n   \
      \ raise ConfigError('Missing STRIPE_API_KEY')"
    bad_example: client = Stripe(api_key='sk_live_9384729183748293')
  - id: STD-PY-SQL-01
    title: SQL Injection Prevention via Parameterized Queries
    description: Always use parameterized queries, prepared statements, or ORM parameter
      binding when assembling SQL. Never format, interpolate (f-strings), or concatenate
      untrusted variables into SQL statements.
    good_example: cursor.execute('SELECT id, email FROM users WHERE tenant_id = %s',
      (tenant_id,))
    bad_example: cursor.execute(f"SELECT id, email FROM users WHERE tenant_id = '{tenant_id}'")
  - id: STD-PY-ERR-01
    title: Explicit Exception Handling (No Bare Excepts)
    description: 'Never use bare ''except:'' clauses or silent ''except Exception: pass''.
      Always catch specific exception types, log actionable context, and preserve tracebacks
      with ''raise ... from exc''.'
    good_example: "try:\n    data = json.loads(payload)\nexcept json.JSONDecodeError\
      \ as exc:\n    logger.warning('Malformed payload: %s', exc)\n    raise BadRequest('Invalid\
      \ JSON') from exc"
    bad_example: "try:\n    data = json.loads(payload)\nexcept:\n    pass"
  - id: STD-PY-RES-01
    title: Deterministic Context Manager Resource Cleanup
    description: Always use context managers ('with' or 'async with') for files, connections,
      sockets, and sessions to prevent leaked descriptors on error.
    good_example: "with open(path, 'w', encoding='utf-8') as f:\n    f.write(data)"
    bad_example: 'f = open(path, ''w'')

      f.write(data)

      f.close()'
  - id: STD-FASTAPI-ASYNC-01
    title: No Blocking Synchronous Calls in Async Route Handlers
    description: Do not call blocking synchronous I/O operations (e.g. requests.get,
      time.sleep, blocking DB calls) inside async def route handlers. Use non-blocking
      async equivalents (httpx.AsyncClient, asyncio.sleep) or offload to threadpool
      via run_in_threadpool.
    good_example: "async def get_user_status(client: httpx.AsyncClient) -> dict:\n \
      \   resp = await client.get('https://service/status', timeout=5.0)\n    return\
      \ resp.json()"
    bad_example: "async def get_user_status() -> dict:\n    resp = requests.get('https://service/status')\n\
      \    return resp.json()"
  - id: STD-FASTAPI-VAL-01
    title: Strict Schema Validation at Service Boundaries
    description: Validate all incoming request bodies and query parameters with strict
      Pydantic models. Avoid untyped dict payloads or raw request parameter access.
    good_example: "class UpdateUserRequest(BaseModel):\n    email: EmailStr\n    age:\
      \ int = Field(ge=18, le=120)"
    bad_example: "async def update_user(payload: dict):\n    email = payload['email']"
