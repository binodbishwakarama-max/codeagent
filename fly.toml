# ==============================================================================
# Fly.io Production Configuration for Prism Review
# Multi-process architecture: Web API (FastAPI) + Background Worker (ARQ)
#
# Topology Note:
# Fly.io machines run strictly CPU workloads (API gateway & background workers).
# Model inference is decoupled to an external GPU inference server (e.g., RunPod,
# Modal, AWS EC2 G5, or Lambda Labs) running vLLM with AWQ 4-bit or 16-bit BF16.
#
# Configure connection to remote GPU vLLM cluster:
#   fly secrets set LLM_PROVIDER="openai_compat"
#   fly secrets set LLM_BASE_URL="https://<gpu-endpoint>/v1"
#   fly secrets set LLM_MODEL="Qwen/Qwen2.5-Coder-7B-Instruct-Prism-Review"
#
# Or configure cloud provider fallback:
#   fly secrets set ANTHROPIC_API_KEY="sk-ant-..."
# ==============================================================================

app = "prism-review"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[processes]
  web = "/app/docker-entrypoint.sh web"
  worker = "/app/docker-entrypoint.sh worker"

[deploy]
  strategy = "rolling"
  max_unavailable = 0

[env]
  CONFIDENCE_THRESHOLD = "0.75"
  MAX_COMMENTS_PER_PR = "10"
  DAILY_COST_BUDGET_USD = "15.0"
  BUDGET_ENFORCED = "true"
  RETRIEVAL_ENABLED = "true"
  RETRIEVAL_MODE = "hybrid"
  # Default LLM configuration (can be overridden via fly secrets)
  LLM_PROVIDER = "anthropic"
  LLM_MODEL = "claude-3-5-sonnet-20241022"

[http_service]
  processes = ["web"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  processes = ["worker"]
