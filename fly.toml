# ==============================================================================
# Fly.io Production Configuration for Prism Review
# Multi-process architecture: Web API (FastAPI) + Background Worker (ARQ)
# ==============================================================================

app = "prism-review"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[processes]
  web = "/app/docker-entrypoint.sh web"
  worker = "/app/docker-entrypoint.sh worker"

[deploy]
  strategy = "rolling"
  max_unavailable = 0

[env]
  CONFIDENCE_THRESHOLD = "0.75"
  MAX_COMMENTS_PER_PR = "10"
  DAILY_COST_BUDGET_USD = "15.0"
  BUDGET_ENFORCED = "true"
  RETRIEVAL_ENABLED = "true"
  RETRIEVAL_MODE = "hybrid"

[http_service]
  processes = ["web"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  processes = ["worker"]
